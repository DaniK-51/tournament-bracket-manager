version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tournament_db
    environment:
      POSTGRES_USER: ${DB_USER:-tournament}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tournament_password}
      POSTGRES_DB: ${DB_NAME:-tournament_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tournament}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tournament_app
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-tournament}:${DB_PASSWORD:-tournament_password}@db:5432/${DB_NAME:-tournament_db}
      DB_USER: ${DB_USER:-tournament}
      DB_PASSWORD: ${DB_PASSWORD:-tournament_password}
      DB_NAME: ${DB_NAME:-tournament_db}
      DB_HOST: db
      DB_PORT: 5432
      API_KEY_SECRET: ${API_KEY_SECRET:-super_secret_key_change_in_production}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
